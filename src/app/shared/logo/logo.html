
<a routerLink="/" class="logo">
  <img
    src="/MIV MFH Logo.png"
    alt="MIV Mission Logo"
    [style.width]="width"
    [style.height]="height"
  >

  @if (showBlueText) {
    <strong class="blue-text">MIV MISSION</strong>
  }

  @if (showWhiteText) {
    <strong class="white-text">MIV MISSION</strong>
  }
</a>
