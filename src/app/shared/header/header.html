<header class="site-header">
  <div class="header-container">
    <app-logo width="50px" height="50px"></app-logo>

    <nav class="nav-links" [class.open]="menuOpen">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
      >
        Home
      </a>

      <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()"> About Us </a>

      <a routerLink="/mission-fields" routerLinkActive="active" (click)="closeMenu()">
        Mission Fields
      </a>

      <a routerLink="/outreaches" routerLinkActive="active" (click)="closeMenu()"> Outreaches </a>

      <a routerLink="/training-mobilisation" routerLinkActive="active" (click)="closeMenu()">
        Training & Mobilisation
      </a>

      <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()"> Contact Us </a>

      <a routerLink="/donate" routerLinkActive="active" (click)="closeMenu()"> Donate </a>

      <a routerLink="/donate" class="mobile-cta" (click)="closeMenu()"> Support Our Mission </a>
    </nav>

    <a routerLink="/donate" class="header-cta"> Support Our Mission </a>

    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      aria-label="Toggle navigation menu"
    >
      <span [class.active]="menuOpen"></span>
      <span [class.active]="menuOpen"></span>
      <span [class.active]="menuOpen"></span>
    </button>
  </div>
</header>
