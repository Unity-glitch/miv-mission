<header class="site-header">
  <div class="header-container">
    <app-logo width="50px" height="50px"></app-logo>
    <nav class="nav-links" [class.open]="menuOpen">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
      >
        Home
      </a>
      <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()"> About Us </a>
      <a routerLink="/mission" routerLinkActive="active" (click)="closeMenu()"> Our Mission </a>
      <a routerLink="/ministries" routerLinkActive="active" (click)="closeMenu()"> Ministries </a>
      <a routerLink="/events" routerLinkActive="active" (click)="closeMenu()"> Events </a>
      <a routerLink="/sermons" routerLinkActive="active" (click)="closeMenu()"> Sermons </a>
      <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()"> Contact </a>
      <a routerLink="/contact" class="mobile-cta" (click)="closeMenu()"> Support Our Mission </a>
    </nav>

    <a routerLink="/contact" class="header-cta"> Support Our Mission </a>

    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      aria-label="Toggle navigation menu"
    >
      <span [class.active]="menuOpen"></span>
      <span [class.active]="menuOpen"></span>
      <span [class.active]="menuOpen"></span>
    </button>
  </div>
</header>
