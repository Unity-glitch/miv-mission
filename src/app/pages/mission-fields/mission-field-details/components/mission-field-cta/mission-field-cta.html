<section class="mission-cta">
  <div class="mission-cta__overlay"></div>

  <div class="mission-cta__container">
    <div class="mission-cta__content">
      <span class="section-label">MAKE A DIFFERENCE</span>

      <h2>
        Be Part of What God Is Doing in
        <span>{{ field.name }}</span>
      </h2>

      <p>
        Every prayer, every act of generosity, and every contribution helps strengthen the work of
        the mission. Join us as we continue reaching communities and transforming lives.
      </p>

      <div class="mission-cta__actions">
        <a routerLink="/donate" class="mission-cta__button mission-cta__button--primary">
          Support This Mission
        </a>

        <a routerLink="/contact" class="mission-cta__button mission-cta__button--outline">
          Get Involved
        </a>
      </div>
    </div>
  </div>
</section>
