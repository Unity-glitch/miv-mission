<section class="training-detail-hero">
  <div class="training-detail-hero__overlay"></div>

  <div class="training-detail-hero__container">
    <div class="training-detail-hero__breadcrumb" appScrollReveal>
      <a routerLink="/">Home</a>
      <span>/</span>
      <a routerLink="/training-mobilisation">Training & Mobilisation</a>
      <span>/</span>
      <span>{{ course.title }}</span>
    </div>

    <div class="training-detail-hero__content" appScrollReveal>
      <span class="training-detail-hero__label">
        {{ course.category }}
      </span>

      <h1>{{ course.title }}</h1>

      <p>{{ course.description }}</p>

      <div class="training-detail-hero__duration">
        <span>Programme Duration:</span>
        <strong>{{ course.duration }}</strong>
      </div>

      <div class="training-detail-hero__actions">
        <a href="#course-about" class="hero-btn hero-btn--primary"> Explore Programme </a>

        <a routerLink="/donate" class="hero-btn hero-btn--outline"> Support This Programme </a>
      </div>
    </div>
  </div>
</section>
