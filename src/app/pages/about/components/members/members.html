<section class="members">
  <div class="members__container">
    <div class="members__heading" appScrollReveal>
      <span class="section-label">OUR COMMUNITY</span>

      <h2>
        The People Behind
        <span>the Mission</span>
      </h2>

      <p>
        MIV Mission is strengthened by people who share a commitment to serving, supporting and
        advancing the work of the mission.
      </p>
    </div>

    <div class="members__grid">
      @for (member of members; track member.image) {
        <article class="member-card" appScrollReveal>
          <div class="member-card__image">
            <img [src]="member.image" [alt]="member.name" />
          </div>

          <div class="member-card__info">
            <h3>{{ member.name }}</h3>
            <p>{{ member.role }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
